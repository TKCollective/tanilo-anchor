# Ask the Tanilo API to anchor the receipt hashes queued since the last run.
# The API does the work (builds the tree, sends the transaction); this workflow only makes the call.
#
# Manual trigger only ("Run workflow"). The hourly call is made by a scheduler that keeps time
# (an Upstash QStash schedule); see docs/mainnet-launch.md. GitHub's own scheduler was tried first and
# started 2 of about 19 hourly runs on its first day (2026-10-05), so the schedule was removed.
#
# Off until the repository variable ANCHOR_ENABLED is set to 1.
#   Secret   CRON_SECRET      the same value the API holds; sent as "Authorization: Bearer ..."
#   Variable ANCHOR_ENABLED   1 to run
#   Variable ANCHOR_RUN_URL   optional; default https://api.tanilo.io/internal/anchor/run
name: Anchor batch (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anchor-run
  cancel-in-progress: false

jobs:
  run:
    if: vars.ANCHOR_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API to anchor the queued receipt hashes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ANCHOR_RUN_URL: ${{ vars.ANCHOR_RUN_URL }}
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then echo "CRON_SECRET is not set"; exit 1; fi
          url="${ANCHOR_RUN_URL:-https://api.tanilo.io/internal/anchor/run}"
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url")
          echo "HTTP $code"
          # This log is public. Print the outcome and the batch ids only: no counts, and not the raw answer.
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("out.json"))
          except Exception:
              print("answer: not JSON"); raise SystemExit(0)
          print("status:", d.get("status"))
          for b in d.get("batches") or []:
              print("batch:", b.get("batch_id"), "tx:", b.get("tx_hash"), "block time:", b.get("block_time"), "recovered:", b.get("recovered"))
          if d.get("status") not in ("ok", "busy"):
              print("the run did not complete; the error text is available to the operator through the status route")
          PY
          rm -f out.json
          # 200: done (possibly nothing to do). 409: another run holds the lock; the next run takes it.
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
          # Anything else is a failure worth seeing. The hashes stay queued; nothing is lost.
          exit 1
